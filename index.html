<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rizzky2099's Legacy Loom: nine responsive interactive icons exploring the things we inherit, preserve, and pass on.">
  <meta name="author" content="Rizzky2099">
  <title>Rizzky2099 — Legacy Icon Suite</title>
  <style>
    :root {
      --ink: #17252a;
      --paper: #e9dec6;
      --clay: #cf6f50;
      --gold: #e2ae42;
      --sage: #6c9475;
      --plum: #76506d;
      --shadow: 0 16px 32px rgba(23, 37, 42, .12);
    }

    * { box-sizing: border-box; }
    body {
      overflow-x: hidden;
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #cursor-trail { position: fixed; z-index: 0; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    main { position: relative; z-index: 1; display: grid; min-height: 100svh; width: min(1120px, calc(100% - 2.5rem)); margin: 0 auto; place-items: center; }
    .icon-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(.8rem, 2.5vw, 1.75rem); }
    .icon-card {
      position: relative; display: grid; aspect-ratio: 1; place-items: center; padding: 0; overflow: visible; border: 0;
      background: transparent; cursor: pointer;
      transition: transform .24s ease, box-shadow .24s ease;
    }
    .icon-card::before { position: absolute; z-index: 0; width: 140%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, var(--wash) 0 14%, transparent 62%); content: ""; opacity: 0; pointer-events: none; }
    .icon-card.is-active::before { animation: bronze-burst .9s ease-out; }
    .icon-card:hover, .icon-card:focus-visible, .icon-card.is-active { transform: translateY(-6px); outline: none; }
    .icon-card:focus-visible .icon-art { outline: 3px solid var(--ink); outline-offset: 7px; border-radius: 3rem; }
    .icon-art { position: relative; z-index: 1; width: min(82%, 190px); filter: drop-shadow(0 8px 8px rgba(23,37,42,.08)); transition: transform .24s ease, filter .24s ease; }
    .icon-card:hover .icon-art, .icon-card:focus-visible .icon-art, .icon-card.is-active .icon-art { transform: rotate(-4deg) scale(1.08); }
    @media (max-width: 700px) { .icon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 430px) { main { width: min(100% - 1.5rem, 1120px); padding: 1rem 0; } .icon-grid { grid-template-columns: 1fr; } .icon-art { width: 160px; } }
    @keyframes bronze-burst { 0% { opacity: .65; transform: scale(.3); } 100% { opacity: 0; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <canvas id="cursor-trail" aria-hidden="true"></canvas>
  <main>
    <section class="icon-grid" id="icon-grid" aria-label="Nine interactive legacy icons"></section>
  </main>

  <script>
    const icons = [
      { id: 'shield', title: 'Spartan Shield', caption: 'The protection inherited from those before us.', color: '#a7502f', wash: '#f2d7c0', sound: 'bronze shield knock', shape: '<path d="M150 58 214 84v54c0 47-27 76-64 99-37-23-64-52-64-99V84z"/><path d="M150 76v132M105 108h90M112 183h76"/>' },
      { id: 'scroll', title: 'Ancestor Scroll', caption: 'Knowledge preserved across time.', color: '#bf8138', wash: '#f7e5bd', sound: 'papyrus unfurl', shape: '<path d="M96 77h99v146H96zM96 77c-21 0-21 29 0 29m99-29c21 0 21 29 0 29M116 128h59M116 153h59M116 178h42"/>' },
      { id: 'olive', title: 'Olive Branch', caption: 'Roots, peace, and endurance.', color: '#71823c', wash: '#dfe8bb', sound: 'olive leaves rustle', shape: '<path d="M145 223c8-46 9-92 5-144M145 122c-21-1-38-14-44-34 24 0 41 12 44 34M145 151c-24-2-43-16-49-39 27 1 46 14 49 39M151 112c21-7 40-1 53 17-24 8-44 2-53-17M150 145c24-7 44 0 57 20-27 8-48 0-57-20M147 180c-18 4-31 17-37 35M151 181c19 5 31 18 36 35"/>' },
      { id: 'amphora', title: 'Amphora', caption: 'A vessel for shared heritage.', color: '#c25e37', wash: '#f6d8be', sound: 'clay vessel tap', shape: '<path d="M121 73h58M132 73v25c0 16-25 24-25 50v42c0 25 17 39 43 39s43-14 43-39v-42c0-26-25-34-25-50V73"/><path d="M107 119c-22 3-27 28-9 42M193 119c22 3 27 28 9 42M116 160h68M116 181h68M130 202h40"/>' },
      { id: 'lyre', title: 'Lyre', caption: 'Songs carried through generations.', color: '#456887', wash: '#cfe5ea', sound: 'lyre chord', shape: '<path d="M112 213c-15-17-22-42-13-66l16-42M188 213c15-17 22-42 13-66l-16-42M116 105c20 13 48 13 68 0M112 213h76M128 124v78M150 121v81M172 124v78"/><path d="M105 91c10-17 29-24 45-12 16-12 35-5 45 12"/>' },
      { id: 'sundial', title: 'Sundial', caption: 'Time measured under the same sun.', color: '#c29232', wash: '#f6e5ae', sound: 'sunlit chime', shape: '<circle cx="150" cy="154" r="69"/><path d="m150 82 29 89-29-18-29 18zM150 67v18M213 154h-18M150 241v-18M87 154h18M196 108l-13 13M104 200l13-13"/>' },
      { id: 'spear', title: 'Spear', caption: 'Courage passed into action.', color: '#81445b', wash: '#ead1da', sound: 'spear strike', shape: '<path d="M150 57v174M150 57l-18 31 18-9 18 9zM129 218h42M139 231h22"/><path d="M96 193c16-15 25-34 29-55M204 193c-16-15-25-34-29-55"/>' },
      { id: 'lion', title: 'Lion of Legacy', caption: 'Boldness and bravery remembered.', color: '#9b6424', wash: '#f0d8a7', sound: 'lion roar', shape: '<path d="M112 108 94 84l3 39M188 108l18-24-3 39M102 130c4-37 26-59 48-59s44 22 48 59v42c0 31-20 54-48 54s-48-23-48-54z"/><path d="M111 130c12-12 25-17 39-17s28 5 39 17M114 149h25l11-11 11 11h25M150 138v44M125 190c14 11 36 11 50 0M119 116l17-11M181 116l-17-11M116 166l-24-8M116 180l-25 5M184 166l24-8M184 180l25 5"/><circle cx="126" cy="145" r="3"/><circle cx="174" cy="145" r="3"/>' },
      { id: 'achilles', title: 'Achilles Helmet', caption: 'A heroic story carried across centuries.', color: '#b66a2c', wash: '#f4dba7', sound: 'bronze helmet ring', shape: '<path d="M105 214c-13-23-20-48-20-76 0-49 28-80 65-80 40 0 69 32 69 77 0 23-7 45-20 63"/><path d="M112 75c21-24 57-33 86-17l16 29c-33-12-70-7-99 13z"/><path d="M102 132c13-18 30-27 48-27 23 0 43 10 57 27"/><path d="M107 135c12 3 25 1 36-5l7-16 11 16c13 7 29 8 43 3"/><path d="M150 75v98l-14 23"/><path d="M92 151c2 30 13 54 35 70l24-24M208 151c-3 30-15 54-37 71l-23-25"/><path d="M112 175h25M163 175h27"/><circle cx="118" cy="118" r="3"/><circle cx="184" cy="118" r="3"/>' }
    ];

    // One vector drawing has two colour states. Changing the img src makes the visual feedback explicit.
    function imageData(icon, active = false) {
      const main = active ? '#243039' : icon.color;
      const accent = active ? icon.color : '#9a5c2e';
      const glow = active ? icon.wash : '#fbf1dc';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="${icon.title} icon ${active ? 'active' : 'default'}"><rect x="20" y="20" width="260" height="260" rx="52" fill="${glow}"/><rect x="34" y="34" width="232" height="232" rx="38" fill="none" stroke="${accent}" stroke-width="4" opacity=".42"/><path d="M63 61h27v12h12V61h27m42 0h27v12h12V61h27M63 239h27v-12h12v12h27m42 0h27v-12h12v12h27" fill="none" stroke="${accent}" stroke-width="5" stroke-linecap="square" opacity=".62"/><circle cx="150" cy="150" r="96" fill="${active ? icon.color : 'none'}" opacity="${active ? '.14' : '0'}"/><g fill="none" stroke="${main}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">${icon.shape}</g><circle cx="238" cy="67" r="12" fill="${accent}"/></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    const grid = document.querySelector('#icon-grid');
    grid.innerHTML = icons.map(icon => `
      <button class="icon-card" type="button" data-id="${icon.id}" style="--wash:${icon.wash}" aria-label="${icon.title}: ${icon.caption}. Activate to play ${icon.sound}.">
        <img class="icon-art" src="${imageData(icon)}" alt="" data-default="${imageData(icon)}" data-active="${imageData(icon, true)}">
      </button>`).join('');

    // A short, low-key pigment trail lives behind the icons and fades after 2.5 seconds.
    const trail = document.querySelector('#cursor-trail');
    const paint = trail.getContext('2d');
    const trailPoints = [];
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const hexToRgba = (hex, alpha) => {
      const value = hex.slice(1);
      const red = parseInt(value.slice(0, 2), 16);
      const green = parseInt(value.slice(2, 4), 16);
      const blue = parseInt(value.slice(4, 6), 16);
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    };
    function sizeTrail() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      trail.width = Math.round(window.innerWidth * ratio);
      trail.height = Math.round(window.innerHeight * ratio);
      trail.style.width = `${window.innerWidth}px`;
      trail.style.height = `${window.innerHeight}px`;
      paint.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    function paintTrail(now) {
      paint.clearRect(0, 0, window.innerWidth, window.innerHeight);
      while (trailPoints.length && now - trailPoints[0].time > 2500) trailPoints.shift();
      for (let index = 1; index < trailPoints.length; index++) {
        const previous = trailPoints[index - 1];
        const point = trailPoints[index];
        const life = 1 - (now - point.time) / 2500;
        paint.beginPath();
        paint.moveTo(previous.x, previous.y);
        paint.lineTo(point.x, point.y);
        paint.strokeStyle = hexToRgba(point.color, Math.max(0, life) * .38);
        paint.lineWidth = 1 + life * 5;
        paint.lineCap = 'round';
        paint.stroke();
        if (index % 3 === 0) {
          paint.beginPath();
          paint.arc(point.x, point.y, 1 + life * 3, 0, Math.PI * 2);
          paint.fillStyle = hexToRgba(point.color, Math.max(0, life) * .48);
          paint.fill();
        }
      }
      requestAnimationFrame(paintTrail);
    }
    sizeTrail();
    window.addEventListener('resize', sizeTrail);
    if (!prefersReducedMotion) {
      window.addEventListener('pointermove', event => {
        const card = event.target.closest?.('.icon-card');
        const icon = card && icons.find(item => item.id === card.dataset.id);
        trailPoints.push({ x: event.clientX, y: event.clientY, time: performance.now(), color: icon?.color || '#b66a2c' });
        if (trailPoints.length > 180) trailPoints.shift();
      });
      requestAnimationFrame(paintTrail);
    }

    let audioContext;
    function getAudio() {
      audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }
    function tone(ctx, at, frequency, duration, type = 'sine', gain = .065) {
      const osc = ctx.createOscillator(); const amp = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(frequency, at);
      amp.gain.setValueAtTime(.0001, at); amp.gain.exponentialRampToValueAtTime(gain, at + .012); amp.gain.exponentialRampToValueAtTime(.0001, at + duration);
      osc.connect(amp).connect(ctx.destination); osc.start(at); osc.stop(at + duration + .02);
    }
    function noise(ctx, at, duration, gain = .045) {
      const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
      const data = buffer.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const source = ctx.createBufferSource(); const amp = ctx.createGain(); amp.gain.setValueAtTime(gain, at); amp.gain.exponentialRampToValueAtTime(.0001, at + duration);
      source.buffer = buffer; source.connect(amp).connect(ctx.destination); source.start(at);
    }
    function play(id) {
      const ctx = getAudio(), t = ctx.currentTime + .02;
      const effects = {
        shield: () => { tone(ctx,t,160,.12,'triangle',.075); tone(ctx,t+.1,112,.2,'triangle',.065); },
        scroll: () => { noise(ctx,t,.18,.055); tone(ctx,t+.06,285,.08,'square',.025); },
        olive: () => { noise(ctx,t,.16,.035); tone(ctx,t+.09,470,.14,'sine',.035); },
        amphora: () => { tone(ctx,t,240,.13,'sine',.055); tone(ctx,t+.12,180,.18,'triangle',.045); },
        lyre: () => { tone(ctx,t,440,.15,'sine'); tone(ctx,t+.12,554,.15,'sine'); tone(ctx,t+.24,659,.24,'sine'); },
        sundial: () => { tone(ctx,t,720,.15,'sine',.045); tone(ctx,t+.18,960,.28,'sine',.035); },
        spear: () => { tone(ctx,t,120,.07,'square',.065); noise(ctx,t+.04,.07,.045); },
        lion: () => { tone(ctx,t,98,.22,'sawtooth',.07); tone(ctx,t+.16,78,.36,'sawtooth',.055); },
        achilles: () => { tone(ctx,t,310,.12,'triangle',.07); tone(ctx,t+.12,620,.38,'sine',.055); }
      }; effects[id]();
    }
    function activate(card, withSound = true) {
      const icon = icons.find(item => item.id === card.dataset.id); const img = card.querySelector('img');
      document.querySelectorAll('.icon-card').forEach(other => { other.classList.remove('is-active'); other.querySelector('img').src = other.querySelector('img').dataset.default; });
      card.classList.add('is-active'); img.src = img.dataset.active;
      if (withSound) play(icon.id);
    }
    grid.addEventListener('pointerover', event => { const card = event.target.closest('.icon-card'); if (card && !card.classList.contains('is-active')) activate(card, true); });
    grid.addEventListener('focusin', event => { const card = event.target.closest('.icon-card'); if (card && !card.classList.contains('is-active')) activate(card, true); });
    grid.addEventListener('click', event => { const card = event.target.closest('.icon-card'); if (card) activate(card, true); });
    grid.addEventListener('pointerout', event => { const card = event.target.closest('.icon-card'); if (card && !card.contains(event.relatedTarget)) { card.classList.remove('is-active'); card.querySelector('img').src = card.querySelector('img').dataset.default; } });
  </script>
</body>
</html>
